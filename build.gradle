plugins {
    id 'org.spongepowered.gradle.vanilla' version '0.2.1-SNAPSHOT' apply false
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)' apply false
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    java.toolchain.languageVersion = JavaLanguageVersion.of(Integer.parseInt(project.java_version))
    java.withSourcesJar()

    group = project.group
    version = "${project.mod_version}+mc${project.minecraft_version}"

    repositories {
        mavenCentral()
        maven {
            name = 'Sponge Snapshots'
            url = 'https://repo.spongepowered.org/repository/maven-public/'
        }
        maven {
            name = 'BlameJared Maven'
            url = 'https://maven.blamejared.com/'
        }
        maven {
            name = 'Curios Maven'
            url = 'https://maven.theillusivec4.top/'
        }
        maven {
            name = 'CurseMaven'
            url = 'https://cursemaven.com'
            content {
                includeGroup 'curse.maven'
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.release.set(Integer.parseInt(project.java_version))
    }

    // Javadoc still checks HTML, syntax and references; self-explanatory getters and packet codecs stay undocumented
    tasks.withType(Javadoc).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.addBooleanOption('Xdoclint:all,-missing', true)
    }

    // The MIT notice must travel with every copy of the mod, so each jar carries it
    tasks.withType(Jar).configureEach {
        from(rootProject.file('LICENSE')) {
            rename { "LICENSE_${project.mod_id}" }
        }
    }

    processResources {
        def expandProps = [
                'version'                    : project.version,
                'mod_version'                : project.mod_version,
                'group'                      : project.group,
                'minecraft_version'          : project.minecraft_version,
                'minecraft_version_range'    : project.minecraft_version_range,
                'forge_version'              : project.forge_version,
                'forge_loader_version_range' : project.forge_loader_version_range,
                'mod_name'                   : project.mod_name,
                'mod_author'                 : project.mod_author,
                'mod_id'                     : project.mod_id,
                'license'                    : project.license,
                'description'                : project.description
        ]
        filesMatching(['pack.mcmeta', 'META-INF/mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }
}
