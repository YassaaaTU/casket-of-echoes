modLoader="javafml"
loaderVersion="${forge_loader_version_range}"
license="${license}"
issueTrackerURL="https://github.com/YassaaaTU/casket-of-echoes/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_author}"
description='''${description}'''
displayURL="https://github.com/YassaaaTU/casket-of-echoes"
logoFile="soulsvault_logo.png"
# Pixel art: keep it sharp in the mods list
logoBlur=false
credits="Made by DeceasedG for The Casket of Reveries modpack, developed with the help of AI coding assistants."

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="[47.2,)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=false
versionRange="[5.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="epicfight"
mandatory=false
versionRange="[20.0,)"
ordering="AFTER"
side="BOTH"

# Recipe viewers: optional, client-side integrations (crafting grid transfer from the Vault, Vault entry lookups)
[[dependencies.${mod_id}]]
modId="jei"
mandatory=false
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="emi"
mandatory=false
versionRange="*"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="roughlyenoughitems"
mandatory=false
versionRange="*"
ordering="NONE"
side="CLIENT"

# Party providers / quest sharing: optional, used through reflection only when installed
[[dependencies.${mod_id}]]
modId="ftbteams"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ftbquests"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="openpartiesandclaims"
mandatory=false
versionRange="*"
ordering="NONE"
side="BOTH"
